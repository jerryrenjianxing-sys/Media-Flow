<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>MediaFlow</title>
  <style>body{margin:0;background:#f8faf9;color:#263b34;font:16px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{max-width:560px;padding:52px;border:1px solid #d8e6df;border-radius:24px;background:#fff;box-shadow:0 16px 60px #254c3410}h1{font-size:34px;margin:0 0 24px;letter-spacing:-1px}p{line-height:1.7;color:#60736a;overflow-wrap:anywhere}button,a{font:inherit;border:1px solid #c7dbd0;background:#fff;border-radius:10px;padding:10px 15px;color:#245c42;text-decoration:none;cursor:pointer;display:inline-block;margin:8px 8px 0 0}button:first-child{background:#276449;color:white;border-color:#276449}button:disabled{opacity:.45;cursor:default}.meta{font-size:12px;margin-top:28px;color:#87988e}</style>
</head>
<body><main class="card"><h1>MediaFlow</h1><p id="message" role="status">正在检查本地后台…</p><div><button id="retry">重试启动</button><button id="logs">打开日志</button><a id="browser" target="_blank" rel="noopener">在浏览器中打开</a></div><p class="meta" id="version"></p></main><script src="./splash.cjs"></script></body>
</html>
