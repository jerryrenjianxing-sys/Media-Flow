schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Read PROJECT.md before planning. Read STATUS.md for current state and RUNBOOK.md for operations.
  The production path is console -> local API -> SQLite queue -> per-device Worker -> uiautomator2 -> Android.
  Production AI only returns decisions/candidates. User-authorized MBH development sessions may control devices after taking the shared device lock; release it before fixed-runner verification.
  Preserve runtime data and evidence. Device actions default to preview and require explicit authorization for writes.

rules:
  proposal:
    - State explicit non-goals for any change touching devices, data, models, credentials, or architecture.
    - Distinguish current verified facts from assumptions and historical evidence.
  design:
    - Include rollback and explain how runtime databases and device state remain protected.
  tasks:
    - Every task must include an observable verification criterion.
    - Put offline, API, browser, and device checks in increasing-risk order.

operations:
  apply:
    guidance:
      - Keep runtime interfaces and task-state semantics unchanged unless the approved change explicitly modifies them.
      - Do not operate a phone or submit a device task solely to validate documentation or governance changes.
  archive:
    guidance:
      - Update STATUS.md or CHANGELOG.md when the accepted current state changes.
